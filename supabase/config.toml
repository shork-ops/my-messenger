# Supabase CLI configuration for Nexus Messenger.
# project_id is the Supabase project reference (from the project URL).
# Run: npx supabase login && npx supabase link --project-ref wuifyiqnkpridblufxzs
project_id = "wuifyiqnkpridblufxzs"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

# The push webhook cannot send a JWT, so verification is disabled for this function only.
[functions.push-notify]
verify_jwt = false

# Maintenance job: called with the service role key by a scheduler, never by the browser.
[functions.cleanup-media]
verify_jwt = false

# Called by the signed-in user; the JWT identifies whose account is removed.
[functions.delete-account]
verify_jwt = true

# JWT is also verified inside the function before claiming any media.
[functions.view-once]
verify_jwt = true
